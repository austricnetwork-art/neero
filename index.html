<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neero™ | Austric Network</title>
    <style>
        /* Default Dark Mode */
        :root {
            --bg-color: #1a0b2e;
            --text-color: #ffffff;
            --input-bg: #100525;
            --input-text: #fff;
            --shortcut-bg: rgba(255,255,255,0.1);
            --shortcut-text-color: #00f0ff; /* Cyan for Dark Mode */
            --logo-gradient: linear-gradient(135deg, #00f0ff 0%, #5a189e 100%);
        }
        /* Light Mode (Light Blue from Original Design) */
        .light-mode {
            --bg-color: #f0f8ff; /* Alice Blue */
            --text-color: #000080; /* Dark Blue */
            --input-bg: #ffffff;
            --input-text: #000080;
            --shortcut-bg: #e6f3ff;
            --shortcut-text-color: #000080; /* Dark Blue for Light Mode Contrast */
            --logo-gradient: linear-gradient(135deg, #0055ff 0%, #5a189e 100%);
        }
        
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: background-color 0.3s, color 0.3s; }
        
        /* Logo Styling */
        .logo-container { text-align: center; margin-bottom: 30px; }
        .logo-container h1 { font-size: 5em; margin: 0; letter-spacing: 4px; text-transform: uppercase; background: var(--logo-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tagline { margin-top: 10px; font-size: 1.1em; font-weight: 500; opacity: 0.9; }
        
        /* Search Box */
        .search-box { width: 100%; max-width: 600px; display: flex; padding: 0 20px; box-sizing: border-box; }
        .search-box input { width: 100%; padding: 15px 20px; font-size: 1.2em; border: 2px solid #5a189e; background-color: var(--input-bg); color: var(--input-text); border-radius: 30px 0 0 30px; outline: none; }
        .search-box button { padding: 15px 30px; font-size: 1.2em; font-weight: bold; background-color: #ff0055; color: #fff; border: none; border-radius: 0 30px 30px 0; cursor: pointer; transition: background 0.3s; }
        .search-box button:hover { background-color: #00f0ff; color: #100525; }
        
        /* Shortcuts */
        .shortcuts { margin-top: 50px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .shortcut { background: var(--shortcut-bg); padding: 15px 25px; border-radius: 12px; color: var(--shortcut-text-color); text-decoration: none; font-weight: bold; transition: background 0.3s; border: 1px solid #5a189e; }
        .shortcut:hover { background: #5a189e; color: #fff; }
        
        /* Toggle Button */
        .toggle-btn { position: absolute; top: 20px; right: 20px; padding: 10px 20px; background: transparent; color: var(--text-color); border: 2px solid #5a189e; border-radius: 20px; cursor: pointer; font-weight: bold; }
        
        /* Footer & Privacy */
        footer { position: absolute; bottom: 20px; text-align: center; font-size: 0.9em; color: var(--text-color); opacity: 0.7; }
        footer a { color: #ff0055; text-decoration: none; font-weight: bold; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <button class="toggle-btn" onclick="toggleMode()">Toggle Light/Dark</button>
    
    <div class="logo-container">
        <!-- We will replace this text with your actual logo image later -->
        <h1>Neero™</h1>
        <div class="tagline">We respect your privacy.</div>
    </div>

    <div class="search-box">
        <input type="text" placeholder="Search the web or type a URL...">
        <button>Go</button>
    </div>

    <div class="shortcuts">
        <a href="https://austric-tribune.onrender.com" class="shortcut">Austric Tribune</a>
        <a href="https://qurionn.onrender.com" class="shortcut">Qurionn</a>
        <a href="https://agu-core.onrender.com" class="shortcut">AGU Core</a>
    </div>

    <footer>
        <p>&copy; 2024 Neero™ by Austric Network. <a href="#">Privacy Policy</a></p>
    </footer>

    <script>
        function toggleMode() {
            var element = document.body;
            element.classList.toggle("light-mode");
        }
    </script>
</body>
</html>
