<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neero | Austric Network</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #1a0b2e; color: #ffffff; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .logo h1 { font-size: 5em; margin: 0; letter-spacing: 4px; text-transform: uppercase; background: linear-gradient(135deg, #00f0ff 0%, #5a189e 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo p { text-align: center; color: #ff0055; margin-top: 0px; font-size: 1.2em; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        .search-box { margin-top: 40px; width: 100%; max-width: 600px; display: flex; padding: 0 20px; box-sizing: border-box; }
        .search-box input { width: 100%; padding: 15px 20px; font-size: 1.2em; border: 2px solid #5a189e; background-color: #100525; color: #fff; border-radius: 30px 0 0 30px; outline: none; }
        .search-box button { padding: 15px 30px; font-size: 1.2em; font-weight: bold; background-color: #ff0055; color: #fff; border: none; border-radius: 0 30px 30px 0; cursor: pointer; transition: background 0.3s; }
        .search-box button:hover { background-color: #00f0ff; color: #100525; }
        .shortcuts { margin-top: 50px; display: flex; gap: 20px; }
        .shortcut { background: rgba(255,255,255,0.1); padding: 15px 25px; border-radius: 12px; color: #00f0ff; text-decoration: none; font-weight: bold; transition: background 0.3s; border: 1px solid #5a189e; }
        .shortcut:hover { background: #5a189e; color: #fff; }
        footer { position: absolute; bottom: 20px; text-align: center; font-size: 0.9em; color: #5a189e; }
    </style>
</head>
<body>
    <div class="logo">
        <h1>Neero</h1>
        <p>The Austric Network Browser</p>
    </div>

    <div class="search-box">
        <input type="text" placeholder="Search the web or type a URL...">
        <button>Go</button>
    </div>

    <div class="shortcuts">
        <a href="https://austric-tribune.onrender.com" class="shortcut">Austric Tribune</a>
        <a href="https://qurionn.onrender.com" class="shortcut">Qurionn</a>
        <a href="https://agu-core.onrender.com" class="shortcut">AGU Core</a>
    </div>

    <footer>
        <p>&copy; 2024 Neero by Austric Network. All rights reserved.</p>
    </footer>
</body>
</html>
